<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fact Knowledge Layer — Multi-Document Reconciler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: #151c2c;
      --bg-card-hover: #1e293b;
      --border-color: #273549;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-purple: #a855f7;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-dark); color: var(--text-main); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }

    .app-container { min-height: 100vh; display: flex; flex-direction: column; }
    .header { background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 0 24px; sticky: top; }
    .header-inner { max-width: 1400px; margin: 0 auto; height: 64px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--text-main); }
    .brand-badge { background: rgba(56, 189, 248, 0.12); color: var(--accent-blue); border: 1px solid rgba(56, 189, 248, 0.3); font-size: 11px; font-family: var(--font-mono); padding: 2px 8px; border-radius: 4px; }

    .nav-tabs { display: flex; gap: 4px; }
    .tab-button { background: transparent; border: none; color: var(--text-muted); font-weight: 500; font-size: 13px; padding: 10px 16px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.15s ease; }
    .tab-button:hover { color: var(--text-main); background-color: rgba(255, 255, 255, 0.04); }
    .tab-button.active { color: var(--accent-blue); background-color: var(--bg-card-hover); font-weight: 600; }

    .btn-primary { background-color: var(--accent-blue); color: #090d16; font-weight: 700; font-size: 13px; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background-color: var(--bg-card-hover); color: var(--text-main); border: 1px solid var(--border-color); font-weight: 500; font-size: 13px; padding: 8px 16px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .btn-secondary:hover { border-color: var(--text-muted); }

    .main-content { flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; padding: 24px; }
    .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

    .table-container { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 6px; }
    .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    .data-table th { background-color: var(--bg-card-hover); color: var(--text-muted); font-weight: 600; padding: 10px 16px; border-bottom: 1px solid var(--border-color); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    .data-table td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
    .data-table tr:hover { background-color: rgba(255, 255, 255, 0.02); }
    .code-font { font-family: var(--font-mono); }

    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; font-family: var(--font-mono); text-transform: uppercase; }
    .badge-corroborates { background: rgba(16, 185, 129, 0.12); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-contradicts { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-contextualizes { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-uncertain { background: rgba(168, 85, 247, 0.12); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .badge-type { background: rgba(255, 255, 255, 0.06); color: var(--text-muted); border: 1px solid var(--border-color); }

    .cases-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(620px, 1fr)); gap: 20px; }
    .case-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
    .case-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }

    .evidence-quote-box { background-color: var(--bg-dark); border-left: 3px solid var(--accent-blue); padding: 12px 14px; margin: 8px 0; border-radius: 0 4px 4px 0; font-size: 13px; color: #cbd5e1; }
    .evidence-quote-box.b { border-color: var(--accent-purple); }
    .reasoning-box { background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); padding: 12px 14px; border-radius: 6px; font-size: 13px; margin-top: 12px; color: var(--text-main); }
    .diagnostic-box { background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); padding: 12px 14px; border-radius: 6px; font-size: 13px; margin-top: 12px; color: #fca5a5; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 24px; }
    .modal-container { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; max-width: 850px; width: 100%; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .modal-header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 24px; overflow-y: auto; flex: 1; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('showcase');
      const [documents, setDocuments] = useState([]);
      const [facts, setFacts] = useState([]);
      const [relationships, setRelationships] = useState([]);
      const [isSeeding, setIsSeeding] = useState(false);
      const [isUploading, setIsUploading] = useState(false);
      const [selectedFact, setSelectedFact] = useState(null);

      const [searchQuery, setSearchQuery] = useState('');
      const [filterType, setFilterType] = useState('ALL');
      const fileInputRef = useRef(null);

      const loadData = async () => {
        try {
          const [dRes, fRes, rRes] = await Promise.all([
            fetch('/api/documents').then(r => r.json()),
            fetch('/api/facts').then(r => r.json()),
            fetch('/api/relationships').then(r => r.json())
          ]);
          setDocuments(dRes || []);
          setFacts(fRes || []);
          setRelationships(rRes || []);
        } catch (e) {
          console.error(e);
        }
      };

      useEffect(() => {
        loadData();
      }, []);

      const handleSeedDemo = async () => {
        setIsSeeding(true);
        try {
          await fetch('/api/demo/seed', { method: 'POST' });
          await loadData();
        } catch (e) {
          alert('Demo seeding failed');
        } finally {
          setIsSeeding(false);
        }
      };

      const handleFileUpload = async (e) => {
        if (!e.target.files || !e.target.files[0]) return;
        const file = e.target.files[0];
        setIsUploading(true);
        try {
          const formData = new FormData();
          formData.append('file', file);
          const upRes = await fetch('/api/documents', { method: 'POST', body: formData }).then(r => r.json());
          await fetch(`/api/documents/${upRes.id}/process`, { method: 'POST' });
          await loadData();
        } catch (err) {
          alert('Upload failed: ' + err.message);
        } finally {
          setIsUploading(false);
        }
      };

      const corroboration = relationships.find(r => r.category === 'CORROBORATES');
      const contradiction = relationships.find(r => r.category === 'CONTRADICTS');
      const contextual = relationships.find(r => r.category === 'CONTEXTUALIZES');
      const failure = relationships.find(r => r.category === 'UNCERTAIN' && r.diagnostic_fix);

      const filteredFacts = facts.filter(f => {
        const matchesSearch = 
          f.subject.toLowerCase().includes(searchQuery.toLowerCase()) ||
          f.predicate.toLowerCase().includes(searchQuery.toLowerCase()) ||
          f.raw_value.toLowerCase().includes(searchQuery.toLowerCase()) ||
          (f.evidence?.filename || '').toLowerCase().includes(searchQuery.toLowerCase());
        const matchesType = filterType === 'ALL' || f.fact_type === filterType;
        return matchesSearch && matchesType;
      });

      return (
        <div className="app-container">
          <header className="header">
            <div className="header-inner">
              <div className="brand">
                <i data-lucide="layers" style={{ color: '#38bdf8' }}></i>
                <span>Fact Knowledge Layer</span>
                <span className="brand-badge">100% Local Pipeline</span>
              </div>

              <nav className="nav-tabs">
                <button className={`tab-button ${activeTab === 'showcase' ? 'active' : ''}`} onClick={() => setActiveTab('showcase')}>
                  <span>4 Showcase Cases</span>
                </button>
                <button className={`tab-button ${activeTab === 'documents' ? 'active' : ''}`} onClick={() => setActiveTab('documents')}>
                  <span>Documents</span>
                </button>
                <button className={`tab-button ${activeTab === 'facts' ? 'active' : ''}`} onClick={() => setActiveTab('facts')}>
                  <span>Fact Explorer</span>
                </button>
                <button className={`tab-button ${activeTab === 'relationships' ? 'active' : ''}`} onClick={() => setActiveTab('relationships')}>
                  <span>Relationships</span>
                </button>
              </nav>

              <div style={{ display: 'flex', gap: '12px' }}>
                <button className="btn-secondary" onClick={handleSeedDemo} disabled={isSeeding}>
                  <span>{isSeeding ? 'Extracting Local Pipeline...' : '⚡ Seed Demo Dataset'}</span>
                </button>
              </div>
            </div>
          </header>

          <main className="main-content">
            {/* 1. SHOWCASE 4 REQUIRED CASES */}
            {activeTab === 'showcase' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                <div className="card" style={{ background: 'linear-gradient(180deg, #151c2c 0%, #0d1322 100%)' }}>
                  <h2 style={{ fontSize: '18px', fontWeight: '700', marginBottom: '8px', color: '#f8fafc' }}>
                    Demonstration of the Four Required Challenge Cases
                  </h2>
                  <p style={{ color: '#94a3b8', fontSize: '13px' }}>
                    Multi-document fact extraction, grounding, entity resolution, and relationship reasoning run <strong>100% locally inside our Python pipeline</strong> (PyMuPDF, spaCy, scikit-learn, Pint, regex) without external LLMs.
                  </p>
                </div>

                <div className="cases-grid">
                  {/* Case 1: Corroborated Evidence */}
                  <div className="case-card">
                    <div className="case-card-header">
                      <span style={{ fontWeight: '700', fontSize: '15px' }}>1. Corroborated Evidence</span>
                      <span className="badge badge-corroborates">CORROBORATES</span>
                    </div>
                    {corroboration ? (
                      <div>
                        <div className="evidence-quote-box a">
                          <div style={{ fontSize: '11px', color: '#38bdf8', marginBottom: '4px', fontWeight: '600' }}>
                            📄 {corroboration.fact_a?.evidence?.filename} — Page {corroboration.fact_a?.evidence?.page_number}
                          </div>
                          "{corroboration.fact_a?.evidence?.source_text}"
                        </div>
                        <div className="evidence-quote-box b">
                          <div style={{ fontSize: '11px', color: '#c084fc', marginBottom: '4px', fontWeight: '600' }}>
                            📄 {corroboration.fact_b?.evidence?.filename} — Page {corroboration.fact_b?.evidence?.page_number}
                          </div>
                          "{corroboration.fact_b?.evidence?.source_text}"
                        </div>
                        <div className="reasoning-box">
                          <div style={{ fontWeight: '600', color: '#38bdf8', marginBottom: '4px' }}>System Local Reasoning:</div>
                          {corroboration.reasoning}
                        </div>
                      </div>
                    ) : <p style={{ color: '#94a3b8' }}>Click "⚡ Seed Demo Dataset" to run local extraction.</p>}
                  </div>

                  {/* Case 2: Genuine Contradiction */}
                  <div className="case-card">
                    <div className="case-card-header">
                      <span style={{ fontWeight: '700', fontSize: '15px' }}>2. Genuine Contradiction</span>
                      <span className="badge badge-contradicts">CONTRADICTS</span>
                    </div>
                    {contradiction ? (
                      <div>
                        <div className="evidence-quote-box a">
                          <div style={{ fontSize: '11px', color: '#38bdf8', marginBottom: '4px', fontWeight: '600' }}>
                            📄 {contradiction.fact_a?.evidence?.filename} — Page {contradiction.fact_a?.evidence?.page_number}
                          </div>
                          "{contradiction.fact_a?.evidence?.source_text}"
                        </div>
                        <div className="evidence-quote-box b">
                          <div style={{ fontSize: '11px', color: '#c084fc', marginBottom: '4px', fontWeight: '600' }}>
                            📄 {contradiction.fact_b?.evidence?.filename} — Page {contradiction.fact_b?.evidence?.page_number}
                          </div>
                          "{contradiction.fact_b?.evidence?.source_text}"
                        </div>
                        <div className="reasoning-box" style={{ background: 'rgba(239, 68, 68, 0.05)', border: '1px solid rgba(239, 68, 68, 0.2)' }}>
                          <div style={{ fontWeight: '600', color: '#f87171', marginBottom: '4px' }}>System Local Reasoning:</div>
                          {contradiction.reasoning}
                        </div>
                      </div>
                    ) : <p style={{ color: '#94a3b8' }}>Click "⚡ Seed Demo Dataset" to run local extraction.</p>}
                  </div>

                  {/* Case 3: Contextual Reconciliation */}
                  <div className="case-card">
                    <div className="case-card-header">
                      <span style={{ fontWeight: '700', fontSize: '15px' }}>3. Contextual Difference</span>
                      <span className="badge badge-contextualizes">CONTEXTUALIZES</span>
                    </div>
                    {contextual ? (
                      <div>
                        <div className="evidence-quote-box a">
                          <div style={{ fontSize: '11px', color: '#38bdf8', marginBottom: '4px', fontWeight: '600' }}>
                            📄 {contextual.fact_a?.evidence?.filename} — Page {contextual.fact_a?.evidence?.page_number}
                          </div>
                          "{contextual.fact_a?.evidence?.source_text}"
                        </div>
                        <div className="evidence-quote-box b">
                          <div style={{ fontSize: '11px', color: '#c084fc', marginBottom: '4px', fontWeight: '600' }}>
                            📄 {contextual.fact_b?.evidence?.filename} — Page {contextual.fact_b?.evidence?.page_number}
                          </div>
                          "{contextual.fact_b?.evidence?.source_text}"
                        </div>
                        <div className="reasoning-box" style={{ background: 'rgba(245, 158, 11, 0.05)', border: '1px solid rgba(245, 158, 11, 0.2)' }}>
                          <div style={{ fontWeight: '600', color: '#fbbf24', marginBottom: '4px' }}>System Local Reasoning:</div>
                          {contextual.reasoning}
                        </div>
                      </div>
                    ) : <p style={{ color: '#94a3b8' }}>Click "⚡ Seed Demo Dataset" to run local extraction.</p>}
                  </div>

                  {/* Case 4: Audit & Extraction Failure */}
                  <div className="case-card">
                    <div className="case-card-header">
                      <span style={{ fontWeight: '700', fontSize: '15px' }}>4. Audit & Extraction Failure</span>
                      <span className="badge badge-uncertain">UNCERTAIN</span>
                    </div>
                    {failure ? (
                      <div>
                        <div className="evidence-quote-box a" style={{ borderLeftColor: '#a855f7' }}>
                          <div style={{ fontSize: '11px', color: '#c084fc', marginBottom: '4px', fontWeight: '600' }}>
                            📄 {failure.fact_a?.evidence?.filename} — Page {failure.fact_a?.evidence?.page_number}
                          </div>
                          "{failure.fact_a?.evidence?.source_text}"
                        </div>
                        <div className="reasoning-box" style={{ background: 'rgba(168, 85, 247, 0.05)', border: '1px solid rgba(168, 85, 247, 0.2)' }}>
                          <div style={{ fontWeight: '600', color: '#c084fc', marginBottom: '4px' }}>System Diagnostic Reasoning:</div>
                          {failure.reasoning}
                        </div>
                        <div className="diagnostic-box">
                          <div style={{ fontWeight: '600', color: '#f87171', marginBottom: '4px' }}>Recommended Diagnostic Fix:</div>
                          {failure.diagnostic_fix}
                        </div>
                      </div>
                    ) : <p style={{ color: '#94a3b8' }}>Click "⚡ Seed Demo Dataset" to run local extraction.</p>}
                  </div>
                </div>
              </div>
            )}

            {/* 2. DOCUMENTS VIEW */}
            {activeTab === 'documents' && (
              <div className="card">
                <div className="card-header">
                  <span className="card-title">📄 Uploaded PDF Documents ({documents.length})</span>
                  <div>
                    <input type="file" ref={fileInputRef} onChange={handleFileUpload} accept=".pdf" style={{ display: 'none' }} />
                    <button className="btn-primary" onClick={() => fileInputRef.current?.click()} disabled={isUploading}>
                      {isUploading ? 'Uploading PDF...' : 'Upload PDF File'}
                    </button>
                  </div>
                </div>
                <div className="table-container">
                  <table className="data-table">
                    <thead>
                      <tr>
                        <th>Filename</th>
                        <th>Doc ID</th>
                        <th>Pages</th>
                        <th>Status</th>
                        <th>Facts</th>
                        <th>Upload Date</th>
                      </tr>
                    </thead>
                    <tbody>
                      {documents.map(d => (
                        <tr key={d.id}>
                          <td style={{ fontWeight: '600' }}>📄 {d.filename}</td>
                          <td className="code-font" style={{ color: '#38bdf8' }}>{d.id}</td>
                          <td>{d.page_count}</td>
                          <td><span className="badge badge-corroborates">{d.processing_status}</span></td>
                          <td style={{ fontWeight: '600', color: '#10b981' }}>{d.fact_count}</td>
                          <td style={{ color: '#94a3b8' }}>{new Date(d.upload_date).toLocaleString()}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 3. FACTS VIEW */}
            {activeTab === 'facts' && (
              <div className="card">
                <div className="card-header">
                  <span className="card-title">🗄️ Atomic Fact Registry ({filteredFacts.length} Facts)</span>
                  <div style={{ display: 'flex', gap: '12px' }}>
                    <input
                      type="text"
                      placeholder="Search claims..."
                      value={searchQuery}
                      onChange={e => setSearchQuery(e.target.value)}
                      style={{ background: '#0b0f19', border: '1px solid #273549', borderRadius: '6px', padding: '6px 12px', color: '#fff', fontSize: '13px' }}
                    />
                    <select
                      value={filterType}
                      onChange={e => setFilterType(e.target.value)}
                      style={{ background: '#0b0f19', border: '1px solid #273549', borderRadius: '6px', padding: '6px 12px', color: '#fff', fontSize: '13px' }}
                    >
                      <option value="ALL">All Fact Types</option>
                      <option value="CURRENCY">Currency</option>
                      <option value="NUMERICAL">Numerical</option>
                      <option value="PERCENTAGE">Percentage</option>
                    </select>
                  </div>
                </div>

                <div className="table-container">
                  <table className="data-table">
                    <thead>
                      <tr>
                        <th>Fact ID</th>
                        <th>Subject</th>
                        <th>Predicate</th>
                        <th>Raw Value</th>
                        <th>Normalized</th>
                        <th>Period</th>
                        <th>Qualifiers</th>
                        <th>PDF Evidence</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredFacts.map(f => (
                        <tr key={f.id}>
                          <td className="code-font" style={{ color: '#38bdf8' }}>{f.id}</td>
                          <td style={{ fontWeight: '600' }}>{f.subject}</td>
                          <td style={{ color: '#94a3b8' }}>{f.predicate}</td>
                          <td style={{ color: '#38bdf8', fontWeight: '600' }}>{f.raw_value}</td>
                          <td className="code-font" style={{ color: '#10b981' }}>{f.normalized_str || f.normalized_value || '—'}</td>
                          <td><span className="badge badge-type">{f.temporal_period || 'Unspecified'}</span></td>
                          <td>{(f.scope_qualifiers || []).map((q, idx) => (
                            <span key={idx} className="badge badge-type" style={{ marginRight: '4px', background: 'rgba(56,189,248,0.1)', color: '#38bdf8' }}>{q}</span>
                          ))}</td>
                          <td>
                            <button className="btn-secondary" style={{ padding: '4px 8px', fontSize: '12px' }} onClick={() => setSelectedFact(f)}>
                              🔍 View Quote
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 4. RELATIONSHIPS VIEW */}
            {activeTab === 'relationships' && (
              <div className="card">
                <div className="card-header">
                  <span className="card-title">🔬 Cross-Document Relationship Matrix ({relationships.length})</span>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  {relationships.map(rel => (
                    <div key={rel.id} className="case-card">
                      <div className="case-card-header">
                        <span className="code-font" style={{ color: '#38bdf8', fontWeight: '600' }}>{rel.id}</span>
                        <div>
                          {rel.category === 'CORROBORATES' && <span className="badge badge-corroborates">CORROBORATES</span>}
                          {rel.category === 'CONTRADICTS' && <span className="badge badge-contradicts">CONTRADICTS</span>}
                          {rel.category === 'CONTEXTUALIZES' && <span className="badge badge-contextualizes">CONTEXTUALIZES</span>}
                          {rel.category === 'UNCERTAIN' && <span className="badge badge-uncertain">UNCERTAIN</span>}
                        </div>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                        <div className="evidence-quote-box a">
                          <div style={{ fontSize: '11px', color: '#38bdf8', fontWeight: '600' }}>📄 {rel.fact_a?.evidence?.filename} (Pg {rel.fact_a?.evidence?.page_number})</div>
                          <div style={{ fontWeight: '600', color: '#fff' }}>{rel.fact_a?.raw_value}</div>
                          <div style={{ fontStyle: 'italic', fontSize: '12px' }}>"{rel.fact_a?.evidence?.source_text}"</div>
                        </div>
                        <div className="evidence-quote-box b">
                          <div style={{ fontSize: '11px', color: '#c084fc', fontWeight: '600' }}>📄 {rel.fact_b?.evidence?.filename} (Pg {rel.fact_b?.evidence?.page_number})</div>
                          <div style={{ fontWeight: '600', color: '#fff' }}>{rel.fact_b?.raw_value}</div>
                          <div style={{ fontStyle: 'italic', fontSize: '12px' }}>"{rel.fact_b?.evidence?.source_text}"</div>
                        </div>
                      </div>
                      <div className="reasoning-box">
                        <strong style={{ color: '#38bdf8' }}>Reasoning: </strong>{rel.reasoning}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* EVIDENCE MODAL */}
          {selectedFact && (
            <div className="modal-overlay" onClick={() => setSelectedFact(null)}>
              <div className="modal-container" onClick={e => e.stopPropagation()}>
                <div className="modal-header">
                  <span style={{ fontWeight: '700' }}>Grounding Evidence Inspector ({selectedFact.id})</span>
                  <button onClick={() => setSelectedFact(null)} style={{ background: 'none', border: 'none', color: '#fff', cursor: 'pointer' }}>✕</button>
                </div>
                <div className="modal-body">
                  <div style={{ background: '#0b0f19', padding: '12px', borderRadius: '6px', marginBottom: '16px' }}>
                    <div style={{ fontSize: '11px', color: '#94a3b8' }}>Source Document & Page</div>
                    <strong style={{ color: '#38bdf8' }}>📄 {selectedFact.evidence?.filename} — Page {selectedFact.evidence?.page_number}</strong>
                  </div>
                  <div className="evidence-quote-box a" style={{ fontSize: '14px', lineHeight: '1.6' }}>
                    "{selectedFact.evidence?.source_text}"
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
